name: TUF-on-CI create Signing events

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  create-signing-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for committing to signing event branch
      actions: write # for dispatching signing event workflow
    steps:
      - name: Create signing events for offline version bumps
        uses: theupdateframework/tuf-on-ci/actions/create-signing-events@5a856002aa88346b68f6b389458aa0041c4cb3cb # v0.20.0 + python-tuf 7 compatibility
        with:
          token: ${{ secrets.TUF_ON_CI_TOKEN || secrets.GITHUB_TOKEN }}

  update-issue:
    runs-on: ubuntu-latest
    needs: [create-signing-events]
    if: always() && !cancelled()
    permissions:
      issues: write # for modifying Issues
      contents: read # for checking out the repository
    steps:
      - name: Update the issue for the workflow
        uses: theupdateframework/tuf-on-ci/actions/update-issue@37b868ef26f7abcffa76c1b15e82bec8beb6a82d # v0.20.0 + python-tuf 7 compatibility
        with:
          token: ${{ secrets.TUF_ON_CI_TOKEN || secrets.GITHUB_TOKEN }}
          success: ${{ !contains(needs.*.result, 'failure') }}
